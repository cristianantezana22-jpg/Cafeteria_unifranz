spring.application.name=cafeteria_backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cafeteria_unifranz}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:13497065}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.sql.init.separator=;;
spring.sql.init.schema-locations=classpath:db/cajero_modulo.sql
spring.sql.init.data-locations=classpath:db/datos_prueba.sql
spring.jpa.defer-datasource-initialization=false

app.jwt.secret=${JWT_SECRET:cambia-esta-clave-por-una-de-al-menos-32-caracteres}
app.jwt.expiration-minutes=480
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173